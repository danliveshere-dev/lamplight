name: Bug report
description: Report a reproducible Lamplight defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Do not include credentials, private application data or undisclosed security details. Follow SECURITY.md for security concerns.
  - type: input
    id: version
    attributes:
      label: Lamplight version or commit
      placeholder: v1.0.0 or full commit SHA
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Include browser and framework versions, setup and the smallest safe example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private data and proprietary consumer code from this report.
          required: true
