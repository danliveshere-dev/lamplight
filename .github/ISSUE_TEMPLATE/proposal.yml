name: Design-system proposal
description: Propose a framework-neutral Lamplight change or adapter contract.
title: "Proposal: "
labels: [proposal]
body:
  - type: markdown
    attributes:
      value: Please describe the reusable problem before prescribing an implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What cannot be expressed through the current public contracts?
    validations:
      required: true
  - type: textarea
    id: consumers
    attributes:
      label: Independent consumers
      description: Show at least two distinct uses, or explain why the change belongs in the core.
    validations:
      required: true
  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility and compatibility
      description: What semantic, keyboard, motion, contrast or compatibility contracts could change?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What could remain consumer-owned instead?
    validations:
      required: true
