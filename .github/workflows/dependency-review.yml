name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          fail-on-severity: moderate
