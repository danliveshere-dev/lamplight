<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lamplight reading room</title>
    <link rel="stylesheet" href="../../src/tokens.css">
    <link rel="stylesheet" href="../../src/components.css">
  </head>
  <body class="l-document">
    <main class="l-room" style="min-height: 100vh; padding: 2rem;">
      <article class="l-panel l-sheen" data-depth="focal">
        <p class="l-etched">Evening reading</p>
        <h1>One passage, held quietly.</h1>
        <div class="l-reading">
          A focused surface can be warm without asking for attention.
        </div>
        <div class="l-actions">
          <button class="l-btn" data-kind="primary" type="button">Keep reading</button>
          <button class="l-btn" data-kind="ghost" type="button">Let it rest</button>
        </div>
      </article>
    </main>
  </body>
</html>
